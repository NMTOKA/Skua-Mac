name: Release Skua Mac

# Builds the downloadable Skua-Mac-<version>.dmg on a GitHub Apple Silicon runner.
#   - Run it by hand (Actions > Release Skua Mac > Run workflow) to get the DMG as a build artifact.
#   - Push a tag like "mac-v2.0.2" to also publish it as a GitHub Release for users to download.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Skua Mac.app and DMG
        run: ./build-mac.sh --dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skua-Mac-dmg
          path: Build/macOS/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Build/macOS/*.dmg \
            --title "Skua Mac ${GITHUB_REF_NAME#mac-v}" \
            --notes-file packaging/macos/RELEASE_NOTES.md
