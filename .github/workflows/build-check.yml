name: Build check

# Compiles the client on Windows and macOS so changes for one platform can't silently break the other.
on:
  push:
    branches: [ master, macos-port ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build client
        run: dotnet build Skua.App.Avalonia/Skua.App.Avalonia.csproj -c Release

      - name: Build manager
        run: dotnet build Skua.Manager.Avalonia/Skua.Manager.Avalonia.csproj -c Release

      - name: Check Flash host scripts
        if: runner.os == 'macOS'
        working-directory: Skua.FlashHost
        run: |
          node --check main.js
          node --check preload.js

      - name: Build Ruffle game host
        if: runner.os == 'macOS'
        run: Skua.RuffleHost/build.sh
